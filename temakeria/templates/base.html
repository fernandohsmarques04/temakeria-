<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Temakeria do Igor{% endblock %}</title>
  <link rel="icon" href="{{ url_for('asset', filename='logo.webp') }}" type="image/webp">
  <link rel="stylesheet" href="{{ url_for('static', filename='temakeria.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="{{ url_for('start') }}">
        <img src="{{ url_for('asset', filename='logo.webp') }}" alt="" width="44" height="44">
        <span><strong>Temakeria</strong><small>Gastronomia japonesa</small></span>
      </a>
      {% block header %}{% endblock %}
    </div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
