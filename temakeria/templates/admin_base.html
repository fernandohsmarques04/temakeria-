{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block header %}
  {% if session.get("authenticated") %}
  <form method="post" action="{{ url_for('admin.logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="button secondary" type="submit">Sair</button>
  </form>
  {% endif %}
{% endblock %}
{% block content %}
<main class="shell admin-main">
  {% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
  {% block panel %}{% endblock %}
</main>
{% endblock %}
