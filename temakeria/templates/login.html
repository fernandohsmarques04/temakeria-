{% extends "admin_base.html" %}
{% block title %}Entrar no painel | Temakeria{% endblock %}
{% block panel %}
<div class="panel editor">
  <h1>Painel do cardápio</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form class="fields" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Senha <input type="password" name="password" autocomplete="current-password" maxlength="128" required autofocus></label>
    <div><button class="button" type="submit">Entrar</button></div>
  </form>
</div>
{% endblock %}
